services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MRI_DATA_DIR: /data
      MRI_CORS_ORIGINS: http://localhost:5173
      MRI_MONGODB_URL: mongodb://mongo:27017
      MRI_MONGODB_DATABASE: mri_agent
    volumes:
      - ./data:/data
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  mongodb_data:
